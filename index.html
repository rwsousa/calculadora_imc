<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body class="text-white">
    <div class="w-full h-screen bg-[#18171c] flex">
        <div class="w-[50%] h-full flex items-center justify-center">
            <img width= "650px" src="./images/fitness-stats-animate (1).svg" alt="Imagem animada">
        </div>
        
        <div class="w-[50%] h-full flex justify-center items-center">
            <div class="w-[80%] h-auto min-h-[400px] bg-[#262626] py-[30px] px-[20px] rounded-md">
                <h1 class="text-[40px] font-bold text-white">Calculadora - IMC</h1>
                <div class=" w-[22%] h-[2px] bg-[#17a34a] rounded-md"></div>
                
                <label for="" class="text-[#CBD4E0] text-[18px] font-bold mt-[20px] block mb-[10px]">Peso em Kg</label>
                <div class="w-full h-[50px] bg-[#3f3f47] relative ">
                    <input type="number" name=" " id="peso" class="w-full h-full bg-transparent border-none outline-none pl-[35px] pr-[35px]">
                    <i class="fa-solid fa-weight-scale fa-flip absolute left-2 top-1/2 -translate-y-1/2 text-[15px]" style="color: rgb(23, 163, 74);"></i>
                    <p class="absolute right-2 top-1/2 -translate-y-1/2 text-[#CBD4E0]">Kg</p>
                </div>

                <label for="" class="text-[#CBD4E0] text-[18px] font-bold mt-[20px] block mb-[10px]"> Altura em metros </label>
                <div class="w-full h-[50px] bg-[#3f3f47] flex">
                    <div class="w-[7%] h-full flex items-center justify-center">
                        <i class="fa-solid fa-ruler fa-flip text-[15px]" style="color: rgb(23, 163, 74);"></i>
                    </div>
                    
                    <input type="number" name="" id="altura" class="w-[86%] h-full bg-transparent border-none outline-none">
                    <div class="w-[7%] h-full flex items-center justify-center text-[#CBD4E0]">
                        m
                    </div>
                </div>

                <button id="botao" class="w-full h-[50px] bg-[#17A34A] font-bold text-[20px] text-[##C5FFDE] mt-[30px] rounded-md cursor-pointer">
                    Calcular
                </button>
                
                <div class="w-full h-[1px] bg-[#3f3f47] my-[20px]"></div>
                
                <div class="w-full h-[150px] flex">
                    <div class="w-[20%] h-full flex items-center justify-center flex-col">
                        <p class="text-[30px] text-[#17a34a] font-[550]">20,81</p>
                        <p class="text-[#C5FFDE]">Seu IMC</p>
                    </div>
                    
                    <div class="w-[80%] h-full flex items-center justify-center text-center">
                        <p class="text-[#C5FFDE] text-[22px]">Você está no peso ideal!</p>
                    </div>
                </div>

                <div class="w-full h-[1px] bg-[#3f3f47] my-[20px]"></div>

                <a href="www.google.com" class="text-[#17a34a] flex justify-center items-center">
                    Mais informações sobre o IMC
                </a>
    
            </div>
           
        </div>


    </div>
    
    <script src="./script.js">

    </script>
</body>
</html>
